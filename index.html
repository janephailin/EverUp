<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EverUp</title>
  <link rel="alternate" hreflang="en" href="https://everupcommerce.com/en/" />
  <link rel="alternate" hreflang="th" href="https://everupcommerce.com/th/" />
  <link rel="alternate" hreflang="x-default" href="https://everupcommerce.com/en/" />
  <script>
    // Send Thai-language browsers to /th/, everyone else to /en/
    var lang = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
    window.location.replace(lang.toLowerCase().indexOf('th') === 0 ? 'th/' : 'en/');
  </script>
  <meta http-equiv="refresh" content="1;url=en/">
  <link rel="icon" type="image/png" href="assets/everup-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@600&text=%E0%B9%84%E0%B8%97%E0%B8%A2&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; min-height: 100vh; margin: 0; padding: 24px;
      background: #F2F6F2; color: #2C2C2C;
    }
    img { width: 168px; height: auto; display: block; }
    p { display: flex; gap: 10px; margin: 0; }
    a {
      color: #2C2C2C; font-weight: 600; text-decoration: none;
      font-size: 15px; padding: 10px 22px; border-radius: 10px;
      border: 1px solid #CBCFCB; background: #FFFFFF;
    }
    a:hover { border-color: #2C2C2C; }
  </style>
</head>
<body>
  <img src="assets/everup-logo-1line-open-black.png" alt="EverUp">
  <p><a href="en/">English</a><a href="th/">ไทย</a></p>
</body>
</html>
